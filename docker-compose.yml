version: '3.8' 
services: 
  postgres: 
      image: postgis/postgis:15-3.3 
      container\_name: cont\_postgis 
      environment: 
        POSTGRES\_USER: postgres 
        POSTGRES\_PASSWORD: rootpassword 
        POSTGRES\_DB: cont\_logistics\_db 
        ports:
        - "5432:5432" 
        volumes: 
        - pgdata:/var/lib/postgresql/data
        - ./database/init-postgis.sql:/docker-entrypoint-initdb.d/init.sql 
        redis: 
        image: redis:7-alpine 
        container\_name: cont\_redis 
      ports: 
        - "6379:6379" 
      volumes:
        pgdata: